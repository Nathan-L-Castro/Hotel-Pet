<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Pet | Meu perfil</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="topo">
    <a href="reservas.html" class="logo">Hotel Pet</a>

    <nav class="menu-principal">
      <ul>
        <li><a href="reservas.html">Reservas</a></li>
        <li><a href="pets.html">Pets</a></li>
        <li><a href="usuarios.html">Usuário</a></li>
        <li><a href="configuracoes.html">Configurações</a></li>
      </ul>
    </nav>

    <a href="perfil.html" class="perfil-topo ativo">
      <img src="https://placehold.co/40x40" alt="Foto de perfil">
      <span>Nome do Gerente</span>
    </a>
  </header>

  <main class="conteudo">
    <h1>Meu perfil</h1>

    <form class="grade-formulario">
      <div class="campo campo-largo">
        <label for="foto">Foto de perfil</label>
        <img src="https://placehold.co/100x100" alt="Foto de perfil atual" class="foto-perfil-atual">
        <input type="file" id="foto" name="foto">
      </div>

      <div class="campo">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" value="Nome do Gerente">
      </div>

      <div class="campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" value="gerente@hotelpet.com">
      </div>

      <div class="campo">
        <label for="telefone">Telefone</label>
        <input type="tel" id="telefone" name="telefone" value="(77) 98888-0000">
      </div>

      <div class="campo">
        <label for="senha">Nova senha</label>
        <input type="password" id="senha" name="senha" placeholder="Deixe em branco para manter a senha atual">
      </div>

      <div class="acoes-formulario">
        <button type="submit" class="btn btn-primario">Salvar alterações</button>
      </div>
    </form>
  </main>

  <footer class="rodape">
    <p>&copy; 2026 Hotel Pet</p>
  </footer>

</body>
</html>
