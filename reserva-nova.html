<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Pet | Nova reserva</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="topo">
    <a href="reservas.html" class="logo">Hotel Pet</a>

    <nav class="menu-principal">
      <ul>
        <li><a href="reservas.html" class="ativo">Reservas</a></li>
        <li><a href="pets.html">Pets</a></li>
        <li><a href="usuarios.html">Usuário</a></li>
        <li><a href="configuracoes.html">Configurações</a></li>
      </ul>
    </nav>

    <a href="perfil.html" class="perfil-topo">
      <img src="https://placehold.co/40x40" alt="Foto de perfil">
      <span>Nome do Gerente</span>
    </a>
  </header>

  <main class="conteudo">
    <a href="reservas.html" class="link-voltar">&larr; Voltar para reservas</a>

    <h1>Nova reserva</h1>

    <form class="grade-formulario" action="reservas.html" method="get">
      <div class="campo">
        <label for="pet">Pet (já cadastrado)</label>
        <select id="pet" name="pet" required>
          <option value="">Selecione um pet</option>
          <option value="thor">Thor</option>
          <option value="luna">Luna</option>
          <option value="mel">Mel</option>
        </select>
      </div>

      <div class="campo">
        <label for="checkin">Data de check-in</label>
        <input type="date" id="checkin" name="checkin" required>
      </div>

      <div class="campo">
        <label for="checkout">Data de check-out</label>
        <input type="date" id="checkout" name="checkout" required>
      </div>

      <div class="campo campo-largo">
        <label for="informacoes">Informações sobre o pet para a estadia</label>
        <textarea id="informacoes" name="informacoes" rows="3" placeholder="Alimentação, medicação, comportamento, etc."></textarea>
      </div>

      <div class="campo">
        <label for="valor">Valor total (calculado automaticamente)</label>
        <input type="text" id="valor" name="valor" value="R$ 0,00" readonly>
      </div>

      <div class="acoes-formulario">
        <button type="submit" class="btn btn-primario">Criar reserva</button>
        <a href="reservas.html" class="btn btn-secundario">Cancelar</a>
      </div>
    </form>
  </main>

  <footer class="rodape">
    <p>&copy; 2026 Hotel Pet</p>
  </footer>

</body>
</html>
