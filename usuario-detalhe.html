<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Pet | Ana Souza</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="topo">
    <a href="reservas.html" class="logo">Hotel Pet</a>

    <nav class="menu-principal">
      <ul>
        <li><a href="reservas.html">Reservas</a></li>
        <li><a href="pets.html">Pets</a></li>
        <li><a href="usuarios.html" class="ativo">Usuário</a></li>
        <li><a href="configuracoes.html">Configurações</a></li>
      </ul>
    </nav>

    <a href="perfil.html" class="perfil-topo">
      <img src="https://placehold.co/40x40" alt="Foto de perfil">
      <span>Nome do Gerente</span>
    </a>
  </header>

  <main class="conteudo">
    <a href="usuarios.html" class="link-voltar">&larr; Voltar para usuário</a>

    <h1>Editar usuário</h1>

    <form class="grade-formulario">
      <div class="campo">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" value="Ana Souza">
      </div>

      <div class="campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" value="ana.souza@email.com">
      </div>

      <div class="campo">
        <label for="telefone">Telefone</label>
        <input type="tel" id="telefone" name="telefone" value="(77) 99999-0000">
      </div>

      <!-- Exclusivo do gerente: mudar a função do usuário -->
      <div class="campo">
        <label for="funcao">Função</label>
        <select id="funcao" name="funcao">
          <option value="cliente" selected>Cliente</option>
          <option value="funcionario">Funcionário</option>
          <option value="gerente">Gerente</option>
        </select>
      </div>

      <div class="campo">
        <label for="status">Status</label>
        <select id="status" name="status">
          <option value="ativo" selected>Ativo</option>
          <option value="inativo">Inativo</option>
        </select>
      </div>

      <div class="acoes-formulario">
        <button type="submit" class="btn btn-primario">Salvar alterações</button>
        <button type="button" class="btn btn-perigo">Remover usuário</button>
      </div>
    </form>
  </main>

  <footer class="rodape">
    <p>&copy; 2026 Hotel Pet</p>
  </footer>

</body>
</html>
